<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veil PII Playground</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#f6f6f8; --surface:#fff; --ink:#111a4a; --text:#22263a; --muted:#7c7f88; --line:#e1e2e8;
  --accent:#167e6c; --accent-soft:#e3f3ee; --accent-ink:#0f5e51; --signal:#ec652b; --signal-soft:#fdeee6; --navy-soft:#e8eaf4;
  --g-person:#dbe7ff; --g-contact:#d9f3e4; --g-fin:#fff1cc; --g-id:#e0f4f7; --g-place:#f3e2ff; --g-org:#ffe0d6; --g-miss:#efeff3;
  --shadow:0 8px 28px rgba(17,26,74,.08);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#0f1330; --surface:#171c3f; --ink:#e8e9f0; --text:#d6d8e3; --muted:#9a9db0; --line:#2a3060;
  --accent:#44b48b; --accent-soft:#163a34; --accent-ink:#8fe0c0; --signal:#f0824f; --signal-soft:#3e2418; --navy-soft:#20265a;
  --g-person:#2b3d6b; --g-contact:#1f4a37; --g-fin:#4d3f14; --g-id:#1f3f45; --g-place:#3f2a55; --g-org:#4d2a20; --g-miss:#2a2d3f; --shadow:0 8px 28px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --ground:#0f1330; --surface:#171c3f; --ink:#e8e9f0; --text:#d6d8e3; --muted:#9a9db0; --line:#2a3060;
  --accent:#44b48b; --accent-soft:#163a34; --accent-ink:#8fe0c0; --signal:#f0824f; --signal-soft:#3e2418; --navy-soft:#20265a;
  --g-person:#2b3d6b; --g-contact:#1f4a37; --g-fin:#4d3f14; --g-id:#1f3f45; --g-place:#3f2a55; --g-org:#4d2a20; --g-miss:#2a2d3f; --shadow:0 8px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font:14px/1.6 "IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--surface)}
header .logo{width:26px;height:26px;color:var(--accent)}
header h1{font-size:16px;margin:0;color:var(--ink);font-weight:700;letter-spacing:-.01em}
header span{color:var(--muted);font-size:12px}
main{max-width:1180px;margin:0 auto;padding:28px 24px 64px}
.top{max-width:1080px;margin:0 auto}
.search{display:flex;align-items:flex-start;gap:12px;padding:12px 14px 12px 18px;border:1.5px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow);transition:border-color .15s}
.search:focus-within{border-color:var(--accent)}
.search .ico{flex:none;width:22px;height:22px;margin-top:6px;color:var(--accent)}
.search textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--text);font:inherit;font-size:15px;line-height:1.7;min-height:56px;max-height:220px;padding:4px 0}
.search .side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.search button{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.search button:disabled{opacity:.45;cursor:not-allowed}
.search .cnt{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
.search .cnt.over{color:var(--signal);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 20px;align-items:center}
.chips .lbl{font-size:11.5px;color:var(--muted);margin-right:4px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;background:var(--surface);color:var(--text);cursor:pointer;font-family:inherit}
.chip:hover{border-color:var(--accent)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.why{font-size:12.5px;color:var(--muted);margin:-10px 0 16px;padding-left:2px}
.rows{display:flex;flex-direction:column;gap:12px}
/* ---- 하단 비교표 섹션: 위 탐지 영역과 명도·괘선·헤더로 구분 ---- */
.ref{margin:44px -24px 0;padding:26px 24px 34px;background:var(--navy-soft);border-top:3px solid var(--line)}
.ref .in{max-width:1132px;margin:0 auto}
.ref .rh{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.ref .rh .eb{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);font-weight:600}
.ref .rh h2{margin:0;font-size:17px}
.ref .rh .sub{font-size:12.5px;color:var(--muted);margin-left:auto}
.ref .wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.ref table{border-collapse:collapse;width:100%;font-size:13px}
.ref th{position:sticky;top:0;background:var(--surface);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:12px 14px;border-bottom:2px solid var(--line);text-align:left;white-space:nowrap;font-weight:600}
.ref td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle;line-height:1.5}
.ref tbody tr.info:nth-child(4n+1) td{background:color-mix(in srgb,var(--navy-soft) 35%,transparent)}
.ref tr.info.ours td:first-child{box-shadow:inset 4px 0 0 var(--accent)}
.ref tr:last-child td{border-bottom:0}
.ref td b{color:var(--ink);font-size:13.5px} .ref td .rel{display:block;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);margin-top:2px}
.ref td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.ref td.f1{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14.5px;font-weight:600;color:var(--ink)}
.ref .bar{display:block;height:5px;border-radius:3px;background:var(--line);margin-top:5px;width:96px;overflow:hidden} .ref .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.ref tr.ours .bar i{background:var(--accent)} .ref tr:not(.ours) .bar i{background:var(--muted);opacity:.6}
.ref td .sm{font-size:11px;color:var(--muted);font-weight:400}
.ref tr.info{cursor:pointer} .ref tr.info:hover td{background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
.ref tr.detail td{background:var(--ground);font-size:12.5px;color:var(--text);line-height:1.7;padding:12px 18px 14px}
.ref tr.detail .cav{color:var(--muted);border-left:2px solid var(--signal);padding-left:8px;margin:6px 0}
.ref tr.detail code{font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--navy-soft);padding:1px 5px;border-radius:4px;color:var(--text);margin-right:3px}
.ref tr.detail a{color:var(--accent-ink)}
.ref .note{font-size:12px;color:var(--muted);margin:10px 2px 0}
@media (max-width:640px){.ref{margin:36px -14px 0;padding:22px 14px 28px}}
.row{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.row.ours{border-color:var(--accent)}
.tag{display:inline-flex;align-items:baseline;gap:10px;padding:5px 14px 6px 14px;border-radius:0 0 12px 0;background:var(--navy-soft);font-size:12px;color:var(--text);max-width:100%}
.tag b{font-size:12.5px;color:var(--ink)}
.tag i{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
.tag .n{font-size:11.5px;color:var(--muted)}
.tag .ok{color:var(--accent-ink);font-weight:600} .tag .bad{color:var(--signal);font-weight:600}
.row.ours .tag{background:var(--accent)} .row.ours .tag b,.row.ours .tag i,.row.ours .tag .n,.row.ours .tag .ok{color:#fff} .row.ours .tag i,.row.ours .tag .n{opacity:.85} .row.ours .tag .bad{color:#ffd9c7}
.txt{padding:10px 18px 14px;font-size:14.5px;line-height:2.15;word-break:keep-all;white-space:pre-wrap;min-height:48px}
.txt.wait{color:var(--muted);font-size:12.5px}
.txt.err{color:var(--signal);font-size:12.5px}
.txt button{margin-left:8px;font:inherit;font-size:11.5px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:2px 8px;cursor:pointer;color:var(--text)}
mark{padding:2px 5px;border-radius:5px;color:inherit;background:var(--g-miss);cursor:default}
mark small{font-size:9.5px;font-weight:600;letter-spacing:.03em;margin-left:3px;opacity:.7;font-family:"IBM Plex Mono",monospace}
mark.person{background:var(--g-person)} mark.contact{background:var(--g-contact)} mark.fin{background:var(--g-fin)} mark.id{background:var(--g-id)} mark.place{background:var(--g-place)} mark.org{background:var(--g-org)}
mark.miss{background:transparent;border:1.5px dashed var(--muted);color:var(--muted)}
mark.fp{background:transparent;border:1.5px dashed var(--signal)}
mark.part{box-shadow:inset 0 -2px 0 0 transparent;border-bottom:2px dashed var(--signal);border-radius:5px 5px 2px 2px}
mark.hl{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:14px 2px 0;font-size:11.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.legend .lg-miss::before{background:transparent;border:1.5px dashed var(--muted)} .legend .lg-fp::before{background:transparent;border:1.5px dashed var(--signal)} .legend .lg-part::before{background:var(--g-place);border-bottom:2px dashed var(--signal);border-radius:3px 3px 1px 1px}
h2{font-size:15px;color:var(--ink);margin:36px 0 10px;font-weight:600}
.wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td b{color:var(--ink)} td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.info{cursor:pointer} tr.info:hover td{background:var(--navy-soft)}
tr.detail td{background:var(--ground);font-size:12px;color:var(--muted);line-height:1.7}
tr.detail code{font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--navy-soft);padding:1px 5px;border-radius:4px;color:var(--text)}
footer{margin-top:40px;font-size:11.5px;color:var(--muted);line-height:1.7}
footer a{color:var(--accent-ink)}
@media (max-width:680px){ .tag{flex-wrap:wrap;gap:6px 10px} main{padding:18px 14px 48px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6l7-3z"/><path d="M9.5 12l2 2 3.5-4"/></svg>
  <h1>Veil PII Playground</h1>
</header>
<main>
  <div class="top">
  <div class="search">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <textarea id="text" rows="2" placeholder="개인정보가 섞인 문장을 붙여 넣으세요 — 예: 김철수 고객님 010-1234-5678 로 연락드렸습니다" aria-label="탐지할 문장"></textarea>
    <div class="side"><button id="run" type="button">탐지 실행 <span style="opacity:.7">⌘↵</span></button><span class="cnt" id="cnt">0 / 2,000</span></div>
  </div>
  <div class="chips" id="chips"><span class="lbl">예시 문장</span></div>
  </div>
  <div class="rows" id="rows"></div>
  <div class="legend">
    <span style="--c:var(--g-person)">사람</span><span style="--c:var(--g-contact)">연락처·주소망</span><span style="--c:var(--g-fin)">금융</span><span style="--c:var(--g-id)">식별번호</span><span style="--c:var(--g-place)">날짜·주소</span><span style="--c:var(--g-org)">조직</span><span class="lg-miss">회색 점선 = 못 잡음</span><span class="lg-fp">붉은 점선 = 오탐</span><span class="lg-part">밑줄 점선 = 경계 불일치</span><span style="margin-left:2px">(예시 문장에서만 판정)</span>
  </div>
  <section class="ref"><div class="in">
    <div class="rh"><span class="eb">Reference</span><h2>모델 비교표</h2></div>
    <div class="wrap"><table id="mtable"><thead><tr><th>모델</th><th>파라미터 · 배포</th><th>라벨</th><th>라이선스</th><th>KDPII test F1</th><th>BCCard val(ko) F1</th><th>합성 heldout F1</th><th>실행</th></tr></thead><tbody></tbody></table></div>
  </div></section>
</main>
<script>
const GROUP = {PERSON:"person", ORGANIZATION:"org", DATE:"place", ADDRESS:"place", ZIPCODE:"place",
  PHONE:"contact", EMAIL:"contact", URL:"contact", IPADDRESS:"contact", MACADDRESS:"contact", PORT:"contact",
  CARD_NUMBER:"fin", ACCOUNT_NUMBER:"fin", CARD_EXPIRY:"fin", CVC:"fin", VIRTUAL_CARD_NUMBER:"fin", TRANSACTION_APPROVAL_ID:"fin"};
const grp = l => GROUP[l] || "id";
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
const MAX = 2000;
let MODELS = [], SCEN = [], HEALTH = {}, gold = null, seq = 0;

// ---- 색칠: 예측 스팬 + (예시 문장이면) 어떤 예측과도 안 겹치는 정답을 점선으로
function paint(text, spans, gold){
  // 정답이 있으면 스팬마다 판정: exact → 라벨색, 겹침만 → 라벨색+밑줄점선, 정답 없음 → 붉은 점선(오탐), 못 잡은 정답 → 회색 점선(미탐)
  const marks = spans.map(p => {
    if (!gold) return {...p, cls: grp(p.label)};
    const exact = gold.some(g => g.start===p.start && g.end===p.end && g.label===p.label);
    const ov = gold.some(g => g.start < p.end && p.start < g.end);
    return {...p, cls: exact ? grp(p.label) : ov ? grp(p.label) + " part" : "fp", tip: exact ? "" : ov ? "경계·라벨 불일치" : "오탐"};
  });
  if (gold) for (const g of gold){
    if (!spans.some(p => p.start < g.end && g.start < p.end)) marks.push({...g, cls: "miss", tip: "못 잡음"});
  }
  marks.sort((a,b) => a.start-b.start);
  let out = "", i = 0;
  for (const m of marks){
    if (m.start < i) continue;                       // 서버가 비겹침 보장, 방어만
    out += esc(text.slice(i, m.start));
    out += `<mark class="${m.cls}" data-s="${m.start}" data-e="${m.end}" title="${m.tip ? m.tip + " · " : ""}${m.label}${m.score!=null ? " · "+m.score : ""}">${esc(text.slice(m.start, m.end))}<small>${m.label}</small></mark>`;
    i = m.end;
  }
  return out + esc(text.slice(i));
}
function tally(spans, gold){
  if (!gold) return `${spans.length} spans`;
  const hit = gold.filter(g => spans.some(p => p.start===g.start && p.end===g.end && p.label===g.label)).length;
  const miss = gold.filter(g => !spans.some(p => p.start < g.end && g.start < p.end)).length;
  const fp = spans.filter(p => !gold.some(g => g.start < p.end && p.start < g.end)).length;
  const part = gold.length - hit - miss;
  const cls = (hit===gold.length && fp===0) ? "ok" : "bad";
  const extra = [part ? `경계 ${part}` : "", miss ? `미탐 ${miss}` : "", fp ? `오탐 ${fp}` : ""].filter(Boolean).join(" · ");
  return `<span class="${cls}">✔ ${hit} / ${gold.length}</span>${extra ? " · " + extra : ""}`;
}

// ---- 행 렌더
function rowEl(m){
  return `<div class="row${m.ours ? " ours" : ""}" id="row-${m.id}"><div class="tag"><b>${esc(m.name)}</b><i id="ms-${m.id}">${esc(m.params)} · ${esc(m.runtime.split(" · ")[0])}</i><span class="n" id="n-${m.id}">${m.labels} labels</span></div><div class="txt wait" id="txt-${m.id}">문장을 입력하고 탐지 실행을 누르세요</div></div>`;
}
function fillRow(m, res, text){
  $(`txt-${m.id}`).className = "txt"; $(`txt-${m.id}`).innerHTML = paint(text, res.spans, gold);
  $(`ms-${m.id}`).textContent = `${res.ms.toLocaleString()} ms · ${m.params}`;
  $(`n-${m.id}`).innerHTML = tally(res.spans, gold);
}
function failRow(m, msg, text){
  const t = $(`txt-${m.id}`); t.className = "txt err"; t.innerHTML = `${esc(msg)} <button type="button">재시도</button>`;
  t.querySelector("button").onclick = () => runOne(m, text, seq);
}
async function runOne(m, text, mySeq){
  const t = $(`txt-${m.id}`);
  if (HEALTH[m.id] !== "ready"){ t.className = "txt wait"; t.textContent = HEALTH[m.id] ? `이 서버에서 로드 실패: ${HEALTH[m.id]}` : "이 환경에서는 꺼져 있는 모델입니다 (VM 배포본에서 켜짐)"; $(`ms-${m.id}`).textContent = `— · ${m.params}`; return; }
  t.className = "txt wait"; t.textContent = "탐지 중…";
  $(`ms-${m.id}`).textContent = `… · ${m.params}`;
  try{
    const r = await fetch("/api/detect", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({text, model:m.id})});
    if (mySeq !== seq) return;                                  // 더 새로운 실행이 있으면 버린다
    if (!r.ok){ const d = await r.json().catch(() => ({})); failRow(m, d.detail || `HTTP ${r.status}`, text); return; }
    fillRow(m, await r.json(), text);
  }catch(e){ if (mySeq === seq) failRow(m, "네트워크 오류", text); }
}
function runAll(){
  const text = $("text").value; if (!text.trim() || text.length > MAX) return;
  seq++; MODELS.forEach(m => runOne(m, text, seq));             // 4개 병렬, 도착 순서대로 채움
}

// ---- 입력·칩
function setCount(){ const n = $("text").value.length; const c = $("cnt"); c.textContent = `${n.toLocaleString()} / ${MAX.toLocaleString()}`; c.classList.toggle("over", n > MAX); $("run").disabled = n === 0 || n > MAX; }
function autoGrow(){ const t = $("text"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 220) + "px"; }
function pick(s){
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.id === (s && s.id)));
  if (s){ $("text").value = s.text; gold = s.gold; }
  else { gold = null; }
  setCount(); autoGrow();
}
$("text").addEventListener("input", () => { pick(null); });
$("text").addEventListener("keydown", e => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter"){ e.preventDefault(); runAll(); } });
$("run").addEventListener("click", runAll);

// ---- hover 동기화: 같은 구간을 다른 행에서도 강조
document.addEventListener("mouseover", e => {
  const m = e.target.closest("mark"); if (!m) return;
  const s = +m.dataset.s, en = +m.dataset.e;
  document.querySelectorAll("mark").forEach(x => x.classList.toggle("hl", +x.dataset.s < en && s < +x.dataset.e));
});
document.addEventListener("mouseout", e => { if (e.target.closest("mark")) document.querySelectorAll("mark.hl").forEach(x => x.classList.remove("hl")); });

// ---- 비교표
function mtable(){
  const tb = $("mtable").querySelector("tbody"); tb.innerHTML = "";
  const f = v => v == null ? "—" : v.toFixed(3);
  const cell = (v, extra) => v == null ? `<td class="f1"><span class="sm">—</span></td>` : `<td class="f1">${f(v)}${extra || ""}<span class="bar"><i style="width:${Math.round(v*100)}%"></i></span></td>`;
  for (const m of MODELS){
    const b = m.bench || {};
    const tr = document.createElement("tr"); tr.className = "info" + (m.ours ? " ours" : ""); tr.tabIndex = 0;
    tr.innerHTML = `<td><b>${esc(m.name)}</b>${m.ours ? ' <span style="color:var(--accent-ink);font-size:11px;font-weight:600;white-space:nowrap">우리 모델</span>' : ""}<span class="rel">${esc(m.released)} 공개</span></td><td class="num">${esc(m.params)}<br><span class="sm">${esc(m.size)}</span></td><td class="num">${m.labels}</td><td>${esc(m.license)}</td>${cell(b.kdpii_test, b.kdpii_test_9labels ? ` <span class="sm">(9라벨 ${f(b.kdpii_test_9labels)})</span>` : "")}${cell(b.bccard_val_ko)}${cell(b.synth_heldout)}<td>${esc(m.runtime)}</td>`;
    const det = document.createElement("tr"); det.className = "detail"; det.hidden = true;
    det.innerHTML = `<td colspan="8">${esc(m.summary)}<div class="cav">주의 · ${esc(m.caveat)}</div>백본 ${esc(m.backbone)} · 지원 라벨 ${m.label_list.map(l => `<code>${l}</code>`).join("")}<br><a href="${esc(m.link)}" target="_blank" rel="noopener">출처 ↗</a></td>`;
    const tog = () => { det.hidden = !det.hidden; };
    tr.onclick = tog; tr.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tog(); } };
    tb.append(tr, det);
  }
}

// ---- 시작: 모델·시나리오 로드 → 시나리오 ① 자동 실행

})();
